name: Deploy Roots Three to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roots-three-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, peops]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate static website
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Site(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      assert attrs['id'] not in self.ids, 'Duplicate ID'
                      self.ids.add(attrs['id'])
                  if tag == 'a' and attrs.get('href', '').startswith('#'):
                      self.links.add(attrs['href'][1:])
          parser = Site()
          parser.feed(Path('index.html').read_text())
          assert parser.links <= parser.ids, f'Missing targets: {parser.links - parser.ids}'
          assert {'home', 'about', 'businesses', 'partners', 'contact'} <= parser.ids
          print('Website navigation validated')
          PY
      - name: Deploy static source to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in repository secrets}"
          : "${VERCEL_ORG_ID:?Configure VERCEL_ORG_ID in repository variables}"
          : "${VERCEL_PROJECT_ID:?Configure VERCEL_PROJECT_ID in repository variables}"
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          base = 'https://api.vercel.com'
          query = urllib.parse.urlencode({'teamId': os.environ['VERCEL_ORG_ID']})
          def request(path, data=None):
              req = urllib.request.Request(base + path + '?' + query,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['VERCEL_TOKEN'], 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'Vercel HTTP {exc.code}: {exc.read().decode()}')
          result = request('/v13/deployments', {
              'name': 'roots-three-site',
              'project': os.environ['VERCEL_PROJECT_ID'],
              'target': 'production',
              'files': [{'file': 'index.html', 'data': Path('index.html').read_text(), 'encoding': 'utf-8'}],
              'projectSettings': {'framework': None, 'buildCommand': None, 'outputDirectory': None},
              'meta': {'githubCommitSha': os.environ['GITHUB_SHA']}
          })
          deployment = result['id']
          for attempt in range(90):
              status = request('/v13/deployments/' + deployment)
              state = status.get('readyState')
              print('Deployment state:', state, flush=True)
              if state == 'READY':
                  url = 'https://' + status['url']
                  print(url)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Production deployment: ' + url + '\n')
                  break
              if state in ('ERROR', 'CANCELED'):
                  raise SystemExit('Deployment failed: ' + str(status.get('errorMessage', state)))
              time.sleep(5)
          else:
              raise SystemExit('Deployment readiness timed out')
          PY
