<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#060b39"><title>Roots Three — Brand Manual</title><style>
:root{color-scheme:dark;--navy:#060b39;--red:#ff2a06;--muted:#a9adbf;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:#03051c;color:white;font-family:"Helvetica Neue",Arial,sans-serif}button,a,input{font:inherit}button,a{color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff5917;outline-offset:3px}header{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 3vw;background:var(--navy);border-bottom:1px solid var(--line)}header strong{font-size:20px;letter-spacing:-.05em;font-style:italic}header strong b{color:var(--red)}header small{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.action,.file-label{border:1px solid var(--line);padding:10px 15px;background:transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:42px}.action:hover:not(:disabled),.file-label:hover{background:#ffffff12}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100dvh - 130px)}aside{position:sticky;top:79px;align-self:start;padding:30px 20px;border-right:1px solid var(--line)}aside h2{font-size:11px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;font-weight:400;margin:0 0 20px}nav{display:grid;gap:4px}nav button{border:0;border-left:2px solid transparent;background:none;text-align:left;padding:13px 10px;display:flex;gap:12px;align-items:center;font-size:14px}nav button span{color:var(--muted);font-size:11px;min-width:22px}nav button[aria-current]{border-color:var(--red);background:#ffffff0a}main{min-width:0;padding:24px 3vw 110px;display:flex;flex-direction:column;align-items:center;gap:16px}.page{width:100%;max-width:1600px;position:relative;display:grid;place-items:center;min-height:260px;background:#101820;border:1px solid var(--line);overflow:hidden}.page canvas{display:block;width:100%;height:auto;background:white}.page canvas[hidden],.empty[hidden]{display:none}.empty{width:100%;min-height:340px;aspect-ratio:16/9;display:grid;place-content:center;text-align:center;padding:32px;background:radial-gradient(ellipse at 85% 0%,#801405,#03051c 65%)}.empty h1{font-size:clamp(34px,6vw,78px);letter-spacing:-.06em;font-weight:400;margin:0 0 12px}.empty p{color:var(--muted);line-height:1.5;max-width:450px;margin:0 auto 24px}.empty label{justify-self:center;background:var(--red);border-color:var(--red)}#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.file-label{cursor:pointer}#status{font-size:12px;color:var(--muted);text-align:center;min-height:18px}.toolbar{position:fixed;z-index:5;bottom:0;left:245px;right:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;background:var(--navy);border-top:1px solid var(--line)}#number{width:65px;padding:10px 6px;text-align:center;border:1px solid var(--line);background:#03051c;color:white}#total{font-size:13px;color:var(--muted)}.chapter-mobile{display:none}footer{position:fixed;bottom:0;left:0;width:245px;padding:26px 30px;font-size:10px;color:var(--muted);background:var(--navy);border-top:1px solid var(--line)}@media(max-width:760px){header{padding:12px 16px}header small{display:none}.layout{display:block}aside{position:static;padding:12px 16px;border:0}aside h2,nav{display:none}.chapter-mobile{display:block;width:100%;color:white;background:var(--navy);border:1px solid var(--line);padding:12px}main{padding:0 12px 100px}.toolbar{left:0;gap:6px}.toolbar .action{padding:10px 12px}footer{display:none}.empty{aspect-ratio:auto;min-height:300px}.page{min-height:0}}@media(prefers-reduced-motion:no-preference){canvas{animation:appear .22s ease}@keyframes appear{from{opacity:.6}to{opacity:1}}}
</style></head><body><header><div><strong>ROOTS<b>3</b></strong> <small>Brand manual / 2026</small></div><label for="file" class="file-label" tabindex="0">Open PDF</label><input type="file" id="file" accept="application/pdf,.pdf" aria-label="Choose the original Roots Three PDF"></header><div class="layout"><aside><h2>Contents</h2><nav aria-label="Manual chapters" id="chapters"></nav><select class="chapter-mobile" id="mobile" aria-label="Choose chapter"></select></aside><main><div class="page" id="page"><div class="empty" id="empty"><h1>ROOTS THREE</h1><p id="message">Loading the original brand manual…</p><label for="file" class="file-label" tabindex="0">Choose original PDF</label></div><canvas id="canvas" hidden aria-label="Original PDF page"></canvas></div><div id="status" role="status" aria-live="polite"></div></main></div><footer>ROOTS THREE · BUILT TO STAY</footer><div class="toolbar" aria-label="Page navigation"><button class="action" id="prev" disabled aria-label="Previous page">←</button><input id="number" type="number" min="1" max="79" value="1" aria-label="Page number" disabled><span id="total">/ 79</span><button class="action" id="next" disabled aria-label="Next page">→</button><button class="action" id="full" disabled aria-label="Full screen">Full screen</button><a class="action" id="original" href="/roots-three-brand-manual.pdf" hidden target="_blank" rel="noopener">PDF ↗</a></div>
<script type="module">
const chapters=[[1,'Cover'],[2,'Introduction'],[4,'Logotypes'],[22,'Typography'],[29,'Chromatics'],[39,'Photography'],[48,'Applications'],[79,'Closing']];
const $=id=>document.getElementById(id);let doc=null,current=1,task=null,sequence=0,sourceUrl=null,loadSequence=0,pdfjs=null;
for(const [page,name] of chapters){const button=document.createElement('button');button.type='button';button.dataset.page=page;const n=document.createElement('span');n.textContent=String(page).padStart(2,'0');button.append(n,document.createTextNode(name));button.onclick=()=>go(page);$('chapters').append(button);const opt=document.createElement('option');opt.value=page;opt.textContent=String(page).padStart(2,'0')+' / '+name;$('mobile').append(opt)}
function controls(){const max=doc?.numPages??79;$('number').max=max;$('number').value=current;$('total').textContent='/ '+max;$('number').disabled=!doc;$('prev').disabled=!doc||current<=1;$('next').disabled=!doc||current>=max;$('full').disabled=!doc||!$('page').requestFullscreen;const chapter=chapters.filter(([n])=>n<=current).at(-1)?.[0]??1;for(const b of $('chapters').children){if(Number(b.dataset.page)===chapter)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}$('mobile').value=chapter}
async function go(value,writeHash=true){if(!doc)return;current=Math.max(1,Math.min(doc.numPages,Math.trunc(Number(value))||1));controls();if(writeHash)history.replaceState(null,'','#page='+current);const ticket=++sequence;if(task){task.cancel();try{await task.promise}catch{} }try{const p=await doc.getPage(current);if(ticket!==sequence)return;const base=p.getViewport({scale:1});const width=$('page').clientWidth||window.innerWidth;const scale=Math.min(3,Math.max(.1,width/base.width)*Math.min(devicePixelRatio||1,2));const viewport=p.getViewport({scale});const canvas=$('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);task=p.render({canvasContext:canvas.getContext('2d'),viewport});await task.promise;if(ticket!==sequence)return;$('empty').hidden=true;canvas.hidden=false;$('status').textContent='Page '+current+' of '+doc.numPages+' · '+(chapters.filter(([n])=>n<=current).at(-1)?.[1]||'');}catch(error){if(error.name!=='RenderingCancelledException'&&ticket===sequence)$('status').textContent='Unable to render this page. Open the original PDF instead.'}}
async function load(input,url){const id=++loadSequence;$('status').textContent='Loading original PDF…';try{if(!pdfjs){pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs'}const next=await pdfjs.getDocument(input).promise;if(id!==loadSequence){await next.destroy();return}if(task){task.cancel();try{await task.promise}catch{}}if(doc)await doc.destroy();doc=next;if(sourceUrl?.startsWith('blob:'))URL.revokeObjectURL(sourceUrl);sourceUrl=url;$('original').href=url;$('original').hidden=false;await go(Number(location.hash.match(/page=(\d+)/)?.[1])||1)}catch(e){if(id!==loadSequence)return;$('message').textContent='The hosted PDF is not available yet. Choose the original 79-page PDF to view its exact design on this website.';$('status').textContent='';if(url.startsWith('blob:'))URL.revokeObjectURL(url)}}
$('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file){const url=URL.createObjectURL(file);await load({data:new Uint8Array(await file.arrayBuffer())},url)}});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('number').onchange=()=>go($('number').value);$('mobile').onchange=()=>go($('mobile').value);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('page').requestFullscreen()};document.querySelectorAll('label[for=file]').forEach(l=>l.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}}));document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','A'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight')go(current+1)});window.addEventListener('hashchange',()=>go(Number(location.hash.match(/page=(\d+)/)?.[1])||1,false));let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>go(current,false),150)});document.addEventListener('fullscreenchange',()=>go(current,false));controls();load('/roots-three-brand-manual.pdf','/roots-three-brand-manual.pdf');
</script></body></html>
